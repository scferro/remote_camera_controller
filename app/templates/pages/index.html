{% extends "base.html" %}

{% block title %}Remote Camera Controller{% endblock %}

{% block content %}
<div id="tab-live-control">
    <div id="app-layout">

        <div id="status-bar">
            {% include 'components/camera_status.html' %}
        </div>

        <div id="preview-section">
            {% include 'components/preview.html' %}
        </div>

        <div id="controls-section">
            <button id="btn-capture-single" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-medium">
                Capture Single Image
            </button>
            <p id="capture-status" class="text-xs text-gray-600 mt-1">Status: Idle</p>
            {% include 'components/timelapse.html' %}
        </div>

    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/camera.js') }}"></script>
<script src="{{ url_for('static', filename='js/preview.js') }}"></script>
<script src="{{ url_for('static', filename='js/timelapse.js') }}"></script>
{% endblock %}
