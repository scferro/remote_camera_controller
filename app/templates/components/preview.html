<div id="preview-container">
    <img id="live-preview-image"
         src="{{ url_for('preview.preview_image', filename='preview.jpg') }}?t=0"
         alt="Live Preview"
         class="hidden"
         onerror="this.style.display='none'; document.getElementById('preview-error').classList.remove('hidden');">
</div>
<div id="preview-error" class="hidden">Preview failed</div>
<div id="preview-controls">
    <label for="preview-rate">FPS</label>
    <input type="number" id="preview-rate" value="5" min="1.0" max="20.0" step="1.0">
    <button id="btn-start-preview">Start</button>
    <button id="btn-stop-preview" disabled>Stop</button>
</div>
