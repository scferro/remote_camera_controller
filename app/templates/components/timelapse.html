<div id="timelapse-panel">
    <div class="timelapse-row">
        <label for="timelapse-interval-seconds" class="timelapse-row-label">Interval</label>
        <div class="number-stepper">
            <button type="button" class="stepper-btn stepper-dec" data-target="timelapse-interval-seconds" data-step="1">&minus;</button>
            <input type="number" id="timelapse-interval-seconds" value="5" min="1" class="stepper-input">
            <button type="button" class="stepper-btn stepper-inc" data-target="timelapse-interval-seconds" data-step="1">+</button>
        </div>
        <span class="timelapse-unit">s</span>
    </div>

    <div class="timelapse-row">
        <label for="timelapse-count" class="timelapse-row-label">Count</label>
        <div class="number-stepper">
            <button type="button" class="stepper-btn stepper-dec" data-target="timelapse-count" data-step="1">&minus;</button>
            <input type="number" id="timelapse-count" value="100" min="2" class="stepper-input">
            <button type="button" class="stepper-btn stepper-inc" data-target="timelapse-count" data-step="1">+</button>
        </div>
    </div>

    <div id="timelapse-duration-display">Duration: <span id="duration-display">8m 20s</span></div>

    <div id="timelapse-buttons">
        <button id="btn-start-timelapse">Start</button>
        <button id="btn-stop-timelapse" class="danger" disabled>Stop</button>
    </div>
    <div id="timelapse-status-container">
        <span>Status: <span id="timelapse-status-message">Idle</span></span>
        <span>Progress: <span id="timelapse-progress">0 / 0</span></span>
    </div>
</div>
